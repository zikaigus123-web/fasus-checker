<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fasus Budget Dashboard</title>

<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="shortcut icon" type="image/x-icon" href="favicon.ico">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
font-family:Arial;
margin:0;
background:#f4f6f8;
}

.header{
background:#111;
color:white;
padding:15px 30px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{height:40px;}
.container{padding:30px;}

.company{
font-size:32px;
font-weight:bold;
}

.updated{
color:#666;
margin-bottom:20px;
}

.cards{
display:flex;
gap:20px;
margin-bottom:25px;
}

.card{
background:white;
padding:20px;
border-radius:8px;
flex:1;
box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

.card-title{color:#666;}

.card-value{
font-size:28px;
font-weight:bold;
margin-top:5px;
}

.charts{
display:flex;
gap:20px;
margin-bottom:30px;
flex-wrap:wrap;
}

.chart-box{
background:white;
padding:20px;
border-radius:8px;
flex:1;
height:350px;
}

table{
width:100%;
background:white;
border-collapse:collapse;
}

th{
background:#eee;
padding:12px;
text-align:left;
}

td{
padding:10px;
border-top:1px solid #ddd;
}

.status-done{color:green;font-weight:bold;}
.status-notyet{color:red;font-weight:bold;}

.time-active{color:green;font-weight:bold;}
.time-near{color:#e6a700;font-weight:bold;}
.time-expired{color:red;font-weight:bold;}

.search-box{
background:white;
padding:15px;
margin-bottom:15px;
border-radius:8px;
box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

.search-input{
width:100%;
padding:12px;
font-size:16px;
border:1px solid #ccc;
border-radius:6px;
}

.highlight{background-color:#fff3cd;}

@media (max-width:768px){
.header{flex-direction:column;gap:10px;text-align:center;padding:15px;}
.logo{height:32px;}
.container{padding:15px;}
.company{font-size:22px;text-align:center;}
.updated{font-size:13px;text-align:center;}
.cards{flex-direction:column;gap:12px;}
.card{padding:15px;}
.card-value{font-size:22px;}
.charts{flex-direction:column;gap:15px;}
.chart-box{height:280px;padding:15px;}
.search-box{padding:12px;}
.search-input{font-size:16px;padding:12px;}
table{font-size:13px;display:block;overflow-x:auto;white-space:nowrap;}
th,td{padding:8px;}
}
</style>
</head>

<body>

<div class="header">
<img src="logo-ut.png" class="logo">
<div>Fasus Budget Dashboard</div>
</div>

<div class="container">

<div class="company" id="companyName"></div>
<div id="companyBC" style="font-size:18px;font-weight:bold;margin-top:5px;"></div>
<div id="companyPlant" style="font-size:16px;font-weight:bold;margin-top:5px;"></div>
<div class="updated" id="updated"></div>

<div class="cards">
<div class="card">
<div class="card-title">Total Amount PJB</div>
<div class="card-value" id="totalPJB">Rp 0</div>
</div>

<div class="card">
<div class="card-title">Total Amount Terpakai</div>
<div class="card-value" id="totalUsed">Rp 0</div>
</div>

<div class="card">
<div class="card-title">Total Amount Sisa Budget PJB</div>
<div class="card-value" id="totalRemain">Rp 0</div>
</div>
</div>

<div class="cards">
<div class="card" id="searchTotalCard" style="display:none;border-left:5px solid #007bff;">
<div class="card-title" id="searchTotalTitle">Total nomor PJB</div>
<div class="card-value" id="searchTotalValue">Rp 0</div>
</div>
</div>

<div class="charts">
<div class="chart-box">
<canvas id="pieChart"></canvas>
</div>
<div class="chart-box">
<canvas id="barChart"></canvas>
</div>
</div>

<div class="charts">
<div class="chart-box" style="height:300px;max-width:400px;margin:auto;">
<canvas id="timeChart"></canvas>
</div>
</div>

<div class="search-box">
<input
type="text"
id="searchInput"
class="search-input"
placeholder="Cari berdasarkan PJB atau Serial Number..."
onkeyup="searchTable()">
</div>

<table>
<thead>
<tr>
<th>PJB</th>
<th>Serial Number</th>
<th>BC</th>
<th>Expired Date</th>
<th>Sisa Budget</th>
<th>Status</th>
<th>Status Waktu</th>
<th>Business Area</th>
<th>Model</th>
</tr>
</thead>

<tbody id="tableBody"></tbody>
</table>

</div>

<script>

const BASE_CSV_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vQhL1bg675LEpC5RKt_JXxCuwLfR36OtrtGr5AeaKBYN4_0fTWax_NcYoHAgUTifDNuv96GPmmf9sS8/pub?gid=17086544&single=true&output=csv";

let pieChartInstance=null;
let barChartInstance=null;
let timeChartInstance=null;
let isLoading=false;

/* ================= ADD ONLY REGION SUPPORT ================= */

function getRegion(){
const params=new URLSearchParams(window.location.search);
return params.get("region");
}

function isRegionMode(){
return getRegion()!==null;
}

/* =========================================================== */

function getCSVUrl(){
return BASE_CSV_URL+"&t="+Date.now();
}

function formatRupiah(num){
return "Rp "+num.toLocaleString("id-ID");
}

function getCompany(){
const params=new URLSearchParams(window.location.search);
return params.get("company");
}

function parseNumber(str){
if(!str) return 0;
return parseFloat(str.replace(/Rp/g,"").replace(/\./g,"").replace(/,/g,"").trim())||0;
}

function getTimeClass(status){
if(status==="ACTIVE") return "time-active";
if(status==="NEAR EXPIRED") return "time-near";
if(status==="EXPIRED") return "time-expired";
return "";
}

function searchTable(){
const input=document.getElementById("searchInput").value.toLowerCase();
const rows=document.querySelectorAll("#tableBody tr");

rows.forEach(row=>{
const pjb=row.getAttribute("data-pjb");
const serial=row.getAttribute("data-serial");
row.classList.remove("highlight");

if(pjb.includes(input)||serial.includes(input)){
row.style.display="";
if(input!=="") row.classList.add("highlight");
}else{
row.style.display="none";
}
});

updateSearchTotal();
}

function updateSearchTotal(){
const input=document.getElementById("searchInput").value.toLowerCase();
const rows=document.querySelectorAll("#tableBody tr");

let total=0;
let foundPJB="";

rows.forEach(row=>{
if(row.style.display==="none") return;

const pjb=row.getAttribute("data-pjb");
if(!foundPJB) foundPJB=pjb;

const cells=row.querySelectorAll("td");
const remainText=cells[4].innerText;
const remain=parseNumber(remainText);
total+=remain;
});

const card=document.getElementById("searchTotalCard");

if(input===""){
card.style.display="none";
return;
}

document.getElementById("searchTotalTitle").innerText="Total nomor PJB "+foundPJB;
document.getElementById("searchTotalValue").innerText=formatRupiah(total);
card.style.display="block";
}

async function loadDashboard(){

if(isLoading) return;
isLoading=true;

try{

const response=await fetch(getCSVUrl(),{cache:"no-store"});
const text=await response.text();

const company=getCompany();
const region=getRegion();

document.getElementById("updated").innerText="Last updated: "+new Date().toLocaleString("id-ID");

const rows=text.split("\n").slice(1);

let totalPJB=0,totalUsed=0,totalRemain=0;
let doneCount=0,notyetCount=0;
let activeCount=0,nearCount=0,expiredCount=0;
let bcSet=new Set();
let plantSet=new Set();

const body=document.getElementById("tableBody");
body.innerHTML="";

rows.forEach(row=>{

const cols=row.split(",");

const rowCompany=cols[0]?.trim();
const rowBusinessArea=cols[11]?.trim();

/* ADD ONLY FILTER */

if(isRegionMode()){
if(rowBusinessArea!==region) return;
}else{
if(rowCompany!==company) return;
}

/* ================= */

const bc=cols[1]?.trim() || "";
const plant=rowBusinessArea || "";
const model=cols[12]?.trim() || "";

if(bc) bcSet.add(bc);
if(plant) plantSet.add(plant);

const expired=cols[2];
const amountPJB=parseNumber(cols[4]);
const status=cols[5];
const pjb=cols[6];
const serial=cols[7];
const used=parseNumber(cols[8]);
const remain=parseNumber(cols[9]);
const statusWaktu=(cols[10]||"").trim().toUpperCase();

if(statusWaktu==="ACTIVE") activeCount++;
else if(statusWaktu==="NEAR EXPIRED") nearCount++;
else if(statusWaktu==="EXPIRED") expiredCount++;

totalPJB+=amountPJB;
totalUsed+=used;
totalRemain+=remain;

if(status==="DONE") doneCount++;
else notyetCount++;

const tr=document.createElement("tr");
tr.setAttribute("data-pjb",pjb.toLowerCase());
tr.setAttribute("data-serial",serial.toLowerCase());

tr.innerHTML=`
<td>${pjb}</td>
<td>${serial}</td>
<td>${bc}</td>
<td>${expired}</td>
<td>${formatRupiah(remain)}</td>
<td class="${status==="DONE"?"status-done":"status-notyet"}">${status}</td>
<td class="${getTimeClass(statusWaktu)}">${statusWaktu}</td>
<td>${plant}</td>
<td>${model}</td>
`;

body.appendChild(tr);

});

/* ADD ONLY HEADER SWITCH */

if(isRegionMode()){
document.getElementById("companyName").innerText=region;
document.getElementById("companyBC").innerText="Area Code: "+region;
document.getElementById("companyPlant").innerText="";
}else{
document.getElementById("companyName").innerText=company;
document.getElementById("companyBC").innerText=
bcSet.size>0 ? "BC: "+Array.from(bcSet).join(" || ") : "";
document.getElementById("companyPlant").innerText=
plantSet.size>0 ? "BUSINESS AREA: "+Array.from(plantSet).join(" || ") : "";
}

document.getElementById("totalPJB").innerText=formatRupiah(totalPJB);
document.getElementById("totalUsed").innerText=formatRupiah(totalUsed);
document.getElementById("totalRemain").innerText=formatRupiah(totalRemain);

}catch(e){console.error(e);}
isLoading=false;
}

loadDashboard();
setInterval(loadDashboard,60000);
document.addEventListener("visibilitychange",function(){if(!document.hidden) loadDashboard();});
window.addEventListener("focus",loadDashboard);
window.addEventListener("pageshow",loadDashboard);

</script>

</body>
</html>
