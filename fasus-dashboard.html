<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fasus Budget Dashboard</title>

<link rel="icon" href="favicon.ico">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
font-family:Arial;
margin:0;
background:#f4f6f8;
}

.header{
background:#111;
color:white;
padding:15px 30px;
display:flex;
align-items:center;
gap:15px;
}

.logo{
height:40px;
}

.container{
padding:30px;
}

.company{
font-size:32px;
font-weight:bold;
}

.updated{
color:#666;
margin-bottom:20px;
}

.cards{
display:flex;
gap:20px;
margin-bottom:25px;
flex-wrap:wrap;
}

.card{
background:white;
padding:20px;
border-radius:8px;
flex:1;
box-shadow:0 2px 6px rgba(0,0,0,0.1);
min-width:250px;
}

.card-title{
color:#666;
}

.card-value{
font-size:28px;
font-weight:bold;
}

.charts{
display:flex;
gap:20px;
margin-bottom:25px;
flex-wrap:wrap;
}

.chart-box{
background:white;
padding:20px;
border-radius:8px;
flex:1;
height:350px;
min-width:300px;
}

.search-box{
background:white;
padding:15px;
border-radius:8px;
margin-bottom:15px;
}

.search-input{
width:100%;
padding:12px;
font-size:16px;
border:1px solid #ccc;
border-radius:6px;
}

table{
width:100%;
background:white;
border-collapse:collapse;
}

th{
background:#eee;
padding:12px;
text-align:left;
}

td{
padding:10px;
border-top:1px solid #ddd;
}

.status-done{
color:green;
font-weight:bold;
}

.status-notyet{
color:red;
font-weight:bold;
}

.time-active{
color:green;
font-weight:bold;
}

.time-near{
color:#e6a700;
font-weight:bold;
}

.time-expired{
color:red;
font-weight:bold;
}

</style>

</head>
<body>

<div class="header">
<img src="logo-ut.png" class="logo">
<div>Fasus Budget Dashboard</div>
</div>

<div class="container">

<div id="companyName" class="company"></div>

<div id="updated" class="updated"></div>

<div class="cards">

<div class="card">
<div class="card-title">Total Amount PJB</div>
<div class="card-value" id="totalPJB">Rp 0</div>
</div>

<div class="card">
<div class="card-title">Total Amount Terpakai</div>
<div class="card-value" id="totalUsed">Rp 0</div>
</div>

<div class="card">
<div class="card-title">Total Amount Sisa Budget</div>
<div class="card-value" id="totalRemain">Rp 0</div>
</div>

</div>

<div class="charts">

<div class="chart-box">
<canvas id="pieChart"></canvas>
</div>

<div class="chart-box">
<canvas id="barChart"></canvas>
</div>

<div class="chart-box">
<canvas id="timeChart"></canvas>
</div>

</div>

<div class="search-box">
<input id="searchInput" class="search-input" placeholder="Cari PJB atau Serial Number">
</div>

<table>

<thead>
<tr>
<th>PJB</th>
<th>Serial Number</th>
<th>Expired Date</th>
<th>Sisa Budget</th>
<th>Status</th>
<th>Status Waktu</th>
</tr>
</thead>

<tbody id="tableBody"></tbody>

</table>

</div>

<script>

const CSV_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vQUKPRwONIwVc0snCr28PWvOKCyRJUf_J4mMEP2qGXFzrhFW_u9NbjlnHnWLXQdnNmZbtkVfAxOQnw9/pub?gid=1324873592&single=true&output=csv";

let pieChart=null;
let barChart=null;
let timeChart=null;

function format(num){
return "Rp "+num.toLocaleString("id-ID");
}

function parse(num){
if(!num)return 0;
return Number(num.toString().replace(/[^\d]/g,"")) || 0;
}

function getCompany(){
return new URLSearchParams(location.search).get("company");
}

function getStatusWaktu(dateStr){

if(!dateStr)return "";

const today=new Date();

const parts=dateStr.split("/");

const expired=new Date(parts[2],parts[1]-1,parts[0]);

const diff=(expired-today)/(1000*60*60*24);

if(diff<0)return "EXPIRED";
if(diff<=90)return "NEAR EXPIRED";
return "ACTIVE";

}

function getTimeClass(status){

if(status==="ACTIVE")return "time-active";
if(status==="NEAR EXPIRED")return "time-near";
if(status==="EXPIRED")return "time-expired";

return "";

}

async function load(){

const res=await fetch(CSV_URL+"&t="+Date.now());

const text=await res.text();

const lines=text.split("\n");

const company=getCompany();

document.getElementById("companyName").innerText=company;

document.getElementById("updated").innerText=
"Last updated: "+new Date().toLocaleString("id-ID");

let totalPJB=0;
let totalUsed=0;
let totalRemain=0;

let done=0;
let notyet=0;

let active=0;
let near=0;
let expired=0;

const tbody=document.getElementById("tableBody");

tbody.innerHTML="";

/* MULAI DARI BARIS 7 */

for(let i=6;i<lines.length;i++){

const row=lines[i];

if(!row || row.trim()==="")continue;

const c=row.split(",");

/* mapping sesuai sheet */

const pemilik=c[1];

if(pemilik!==company)continue;

const expiredDate=c[5];

const amountPJB=parse(c[6]);

const status=c[7];

const pjb=c[8];

const serial=c[9];

const used=parse(c[12]);

const remain=parse(c[13]);

const statusWaktu=getStatusWaktu(expiredDate);

totalPJB+=amountPJB;

totalUsed+=used;

totalRemain+=remain;

if(status==="DONE")done++;
else notyet++;

if(statusWaktu==="ACTIVE")active++;
else if(statusWaktu==="NEAR EXPIRED")near++;
else expired++;

const tr=document.createElement("tr");

tr.innerHTML=`
<td>${pjb}</td>
<td>${serial}</td>
<td>${expiredDate}</td>
<td>${format(remain)}</td>
<td class="${status==="DONE"?"status-done":"status-notyet"}">${status}</td>
<td class="${getTimeClass(statusWaktu)}">${statusWaktu}</td>
`;

tbody.appendChild(tr);

}

/* update cards */

document.getElementById("totalPJB").innerText=format(totalPJB);

document.getElementById("totalUsed").innerText=format(totalUsed);

document.getElementById("totalRemain").innerText=format(totalRemain);

/* pie */

if(pieChart)pieChart.destroy();

pieChart=new Chart(
document.getElementById("pieChart"),
{
type:"pie",
data:{
labels:["Terpakai","Sisa"],
datasets:[{
data:[totalUsed,totalRemain]
}]
}
}
);

/* bar */

if(barChart)barChart.destroy();

barChart=new Chart(
document.getElementById("barChart"),
{
type:"bar",
data:{
labels:["DONE","NOT YET"],
datasets:[{
data:[done,notyet],
backgroundColor:["green","red"]
}]
}
}
);

/* time */

if(timeChart)timeChart.destroy();

timeChart=new Chart(
document.getElementById("timeChart"),
{
type:"pie",
data:{
labels:["ACTIVE","NEAR EXPIRED","EXPIRED"],
datasets:[{
data:[active,near,expired],
backgroundColor:["green","orange","red"]
}]
}
}
);

}

load();

setInterval(load,60000);

</script>

</body>
</html>
