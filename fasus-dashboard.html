<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fasus Budget Dashboard</title>

<link rel="icon" href="favicon.ico">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
font-family:Arial;
margin:0;
background:#f4f6f8;
}

.header{
background:#111;
color:white;
padding:15px 30px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
height:40px;
}

.container{
padding:30px;
}

.company{
font-size:32px;
font-weight:bold;
}

.updated{
color:#666;
margin-bottom:20px;
}

.cards{
display:flex;
gap:20px;
margin-bottom:25px;
flex-wrap:wrap;
}

.card{
background:white;
padding:20px;
border-radius:8px;
flex:1;
min-width:250px;
box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

.card-title{
color:#666;
}

.card-value{
font-size:28px;
font-weight:bold;
margin-top:5px;
}

.chart-box{
background:white;
padding:20px;
border-radius:8px;
flex:1;
min-width:300px;
height:350px;
}

.charts{
display:flex;
gap:20px;
flex-wrap:wrap;
margin-bottom:25px;
}

.search-box{
background:white;
padding:15px;
margin-bottom:15px;
border-radius:8px;
}

.search-input{
width:100%;
padding:12px;
font-size:16px;
}

table{
width:100%;
background:white;
border-collapse:collapse;
}

th,td{
padding:10px;
border-top:1px solid #ddd;
}

.status-done{
color:green;
font-weight:bold;
}

.status-notyet{
color:red;
font-weight:bold;
}

.time-active{
color:green;
font-weight:bold;
}

.time-near{
color:orange;
font-weight:bold;
}

.time-expired{
color:red;
font-weight:bold;
}

#searchTotalCard{
border-left:5px solid #007bff;
display:none;
}

</style>
</head>

<body>

<div class="header">
<img src="logo-ut.png" class="logo">
<div>Fasus Budget Dashboard</div>
</div>

<div class="container">

<div class="company" id="companyName"></div>
<div class="updated" id="updated"></div>

<div class="cards">

<div class="card">
<div class="card-title">Total Amount PJB</div>
<div class="card-value" id="totalPJB">Rp 0</div>
</div>

<div class="card">
<div class="card-title">Total Amount Terpakai</div>
<div class="card-value" id="totalUsed">Rp 0</div>
</div>

<div class="card">
<div class="card-title">Total Amount Sisa Budget</div>
<div class="card-value" id="totalRemain">Rp 0</div>
</div>

<div class="card" id="searchTotalCard">
<div class="card-title" id="searchTotalTitle"></div>
<div class="card-value" id="searchTotalValue"></div>
</div>

</div>

<div class="charts">

<div class="chart-box">
<canvas id="pieChart"></canvas>
</div>

<div class="chart-box">
<canvas id="barChart"></canvas>
</div>

<div class="chart-box">
<canvas id="timeChart"></canvas>
</div>

</div>

<div class="search-box">
<input
type="text"
id="searchInput"
class="search-input"
placeholder="Cari berdasarkan PJB atau Serial Number"
onkeyup="searchTable()">
</div>

<table>

<thead>
<tr>
<th>PJB</th>
<th>Serial Number</th>
<th>Expired Date</th>
<th>Sisa Budget</th>
<th>Status</th>
<th>Status Waktu</th>
</tr>
</thead>

<tbody id="tableBody"></tbody>

</table>

</div>

<script>

const CSV_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vQUKPRwONIwVc0snCr28PWvOKCyRJUf_J4mMEP2qGXFzrhFW_u9NbjlnHnWLXQdnNmZbtkVfAxOQnw9/pub?gid=1748464450&single=true&output=csv";

let pieChart,barChart,timeChart;

function formatRupiah(num){

return "Rp "+num.toLocaleString("id-ID");

}

function parseNumber(str){

if(!str)return 0;

return parseFloat(
str.replace(/Rp/g,"")
.replace(/\./g,"")
.replace(/,/g,"")
.trim()
)||0;

}

/* CSV PARSER FIX */
function parseCSVRow(row){

let result=[];
let current="";
let inside=false;

for(let char of row){

if(char=='"'){
inside=!inside;
continue;
}

if(char==","&&!inside){

result.push(current);
current="";

}else{

current+=char;

}

}

result.push(current);

return result;

}

/* STATUS WAKTU */
function getStatusWaktu(dateStr){

let parts=dateStr.split("/");

if(parts.length!=3)return "";

let expired=new Date(parts[2],parts[1]-1,parts[0]);

let today=new Date();

let diff=(expired-today)/(1000*60*60*24);

if(diff<0)return "EXPIRED";

if(diff<=90)return "NEAR EXPIRED";

return "ACTIVE";

}

function getTimeClass(s){

if(s=="ACTIVE")return "time-active";

if(s=="NEAR EXPIRED")return "time-near";

if(s=="EXPIRED")return "time-expired";

return "";

}

function getCompany(){

return new URLSearchParams(location.search).get("company");

}

function searchTable(){

let input=document.getElementById("searchInput").value.toLowerCase();

let rows=document.querySelectorAll("#tableBody tr");

let total=0;

let pjb="";

rows.forEach(row=>{

let rpjb=row.dataset.pjb;

let serial=row.dataset.serial;

if(rpjb.includes(input)||serial.includes(input)){

row.style.display="";

total+=parseNumber(row.children[3].innerText);

pjb=rpjb;

}else{

row.style.display="none";

}

});

let card=document.getElementById("searchTotalCard");

if(input){

card.style.display="block";

document.getElementById("searchTotalTitle").innerText="Total nomor PJB "+pjb;

document.getElementById("searchTotalValue").innerText=formatRupiah(total);

}else{

card.style.display="none";

}

}

async function loadDashboard(){

let res=await fetch(CSV_URL+"&t="+Date.now());

let text=await res.text();

let rows=text.split("\n").slice(1);

let company=getCompany();

document.getElementById("companyName").innerText=company;

document.getElementById("updated").innerText="Last updated: "+new Date().toLocaleString("id-ID");

let totalPJB=0,totalUsed=0,totalRemain=0;

let done=0,notyet=0;

let active=0,near=0,expired=0;

let body=document.getElementById("tableBody");

body.innerHTML="";

rows.forEach(row=>{

let cols=parseCSVRow(row);

if(cols[1]?.trim()!=company)return;

/* FIX COLUMN MAPPING */
let expiredDate=cols[4];
let amount=parseNumber(cols[5]);
let status=cols[6];
let pjb=cols[7];
let serial=cols[8];
let used=parseNumber(cols[11]);
let remain=parseNumber(cols[12]);

let statusWaktu=getStatusWaktu(expiredDate);

totalPJB+=amount;
totalUsed+=used;
totalRemain+=remain;

status=="DONE"?done++:notyet++;

statusWaktu=="ACTIVE"?active++:
statusWaktu=="NEAR EXPIRED"?near++:
expired++;

let tr=document.createElement("tr");

tr.dataset.pjb=pjb.toLowerCase();
tr.dataset.serial=serial.toLowerCase();

tr.innerHTML=`
<td>${pjb}</td>
<td>${serial}</td>
<td>${expiredDate}</td>
<td>${formatRupiah(remain)}</td>
<td class="${status=="DONE"?"status-done":"status-notyet"}">${status}</td>
<td class="${getTimeClass(statusWaktu)}">${statusWaktu}</td>
`;

body.appendChild(tr);

});

document.getElementById("totalPJB").innerText=formatRupiah(totalPJB);
document.getElementById("totalUsed").innerText=formatRupiah(totalUsed);
document.getElementById("totalRemain").innerText=formatRupiah(totalRemain);

/* CHART */
if(pieChart)pieChart.destroy();

pieChart=new Chart(pieChartCanvas,{
type:"pie",
data:{
labels:["Terpakai","Tersisa"],
datasets:[{data:[totalUsed,totalRemain]}]
}
});

if(barChart)barChart.destroy();

barChart=new Chart(barChartCanvas,{
type:"bar",
data:{
labels:["DONE","NOT YET"],
datasets:[{data:[done,notyet],backgroundColor:["green","red"]}]
}
});

if(timeChart)timeChart.destroy();

timeChart=new Chart(timeChartCanvas,{
type:"pie",
data:{
labels:["ACTIVE","NEAR EXPIRED","EXPIRED"],
datasets:[{data:[active,near,expired],backgroundColor:["green","orange","red"]}]
}
});

}

const pieChartCanvas=document.getElementById("pieChart");
const barChartCanvas=document.getElementById("barChart");
const timeChartCanvas=document.getElementById("timeChart");

loadDashboard();

setInterval(loadDashboard,60000);

</script>

</body>
</html>
