<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fasus Budget Dashboard</title>

<link rel="icon" type="image/x-icon" href="favicon.ico">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
font-family:Arial;
margin:0;
background:#f4f6f8;
}

.header{
background:#111;
color:white;
padding:15px 30px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
height:40px;
}

.container{
padding:30px;
}

.company{
font-size:32px;
font-weight:bold;
}

.updated{
color:#666;
margin-bottom:20px;
}

.cards{
display:flex;
gap:20px;
margin-bottom:25px;
}

.card{
background:white;
padding:20px;
border-radius:8px;
flex:1;
box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

.card-title{
color:#666;
}

.card-value{
font-size:28px;
font-weight:bold;
margin-top:5px;
}

.chart-box{
background:white;
padding:20px;
border-radius:8px;
flex:1;
height:350px;
}

.charts{
display:flex;
gap:20px;
margin-bottom:30px;
flex-wrap:wrap;
}

.search-box{
background:white;
padding:15px;
margin-bottom:15px;
border-radius:8px;
box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

.search-input{
width:100%;
padding:12px;
font-size:16px;
border:1px solid #ccc;
border-radius:6px;
}

table{
width:100%;
background:white;
border-collapse:collapse;
}

th{
background:#eee;
padding:12px;
}

td{
padding:10px;
border-top:1px solid #ddd;
}

.status-done{color:green;font-weight:bold;}
.status-notyet{color:red;font-weight:bold;}

.time-active{color:green;font-weight:bold;}
.time-near{color:#e6a700;font-weight:bold;}
.time-expired{color:red;font-weight:bold;}

.highlight{
background:#fff3cd;
}

</style>
</head>

<body>

<div class="header">
<img src="logo-ut.png" class="logo">
<div>Fasus Budget Dashboard</div>
</div>

<div class="container">

<div class="company" id="companyName"></div>
<div class="updated" id="updated"></div>

<div class="cards">

<div class="card">
<div class="card-title">Total Amount PJB</div>
<div class="card-value" id="totalPJB">Rp 0</div>
</div>

<div class="card">
<div class="card-title">Total Amount Terpakai</div>
<div class="card-value" id="totalUsed">Rp 0</div>
</div>

<div class="card">
<div class="card-title">Total Amount Sisa Budget PJB</div>
<div class="card-value" id="totalRemain">Rp 0</div>
</div>

</div>

<div class="charts">

<div class="chart-box">
<canvas id="pieChart"></canvas>
</div>

<div class="chart-box">
<canvas id="barChart"></canvas>
</div>

<div class="chart-box">
<canvas id="timeChart"></canvas>
</div>

</div>

<div class="search-box">
<input
type="text"
id="searchInput"
class="search-input"
placeholder="Cari berdasarkan PJB atau Serial Number..."
onkeyup="searchTable()"
>
</div>

<table>

<thead>
<tr>
<th>PJB</th>
<th>Serial Number</th>
<th>Expired Date</th>
<th>Sisa Budget</th>
<th>Status</th>
<th>Status Waktu</th>
</tr>
</thead>

<tbody id="tableBody"></tbody>

</table>

</div>

<script>

const BASE_CSV_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vQUKPRwONIwVc0snCr28PWvOKCyRJUf_J4mMEP2qGXFzrhFW_u9NbjlnHnWLXQdnNmZbtkVfAxOQnw9/pub?output=csv";

let pieChartInstance;
let barChartInstance;
let timeChartInstance;

function formatRupiah(num){
return "Rp "+num.toLocaleString("id-ID");
}

function parseNumber(str){
if(!str) return 0;
return Number(str.replace(/[^\d]/g,""));
}

function getCompany(){
return new URLSearchParams(window.location.search).get("company");
}

function parseCSVRow(row){

const result=[];
let current="";
let insideQuotes=false;

for(let char of row){

if(char=='"'){
insideQuotes=!insideQuotes;
continue;
}

if(char=="," && !insideQuotes){
result.push(current);
current="";
}else{
current+=char;
}

}

result.push(current);

return result;

}

function parseDate(str){

const parts=str.split("/");
return new Date(parts[2],parts[1]-1,parts[0]);

}

function getStatusWaktu(expired){

const today=new Date();
const exp=parseDate(expired);

const diff=(exp-today)/(1000*60*60*24);

if(diff<0) return "EXPIRED";
if(diff<=90) return "NEAR EXPIRED";
return "ACTIVE";

}

function getTimeClass(status){

if(status=="ACTIVE") return "time-active";
if(status=="NEAR EXPIRED") return "time-near";
return "time-expired";

}

function searchTable(){

const input=document.getElementById("searchInput").value.toLowerCase();

document.querySelectorAll("#tableBody tr").forEach(row=>{

const pjb=row.dataset.pjb;
const serial=row.dataset.serial;

if(pjb.includes(input)||serial.includes(input)){
row.style.display="";
row.classList.add("highlight");
}else{
row.style.display="none";
row.classList.remove("highlight");
}

});

}

async function loadDashboard(){

const res=await fetch(BASE_CSV_URL+"&t="+Date.now());
const text=await res.text();

const rows=text.split("\n").slice(6);

const company=getCompany();

document.getElementById("companyName").innerText=company;
document.getElementById("updated").innerText=
"Last updated: "+new Date().toLocaleString("id-ID");

let totalPJB=0;
let totalUsed=0;
let totalRemain=0;

let done=0;
let notyet=0;

let active=0;
let near=0;
let expired=0;

const body=document.getElementById("tableBody");
body.innerHTML="";

rows.forEach(row=>{

const cols=parseCSVRow(row);

if(cols[1]?.trim()!=company) return;

const expiredDate=cols[4];
const amount=parseNumber(cols[5]);
const status=cols[6];
const pjb=cols[7];
const serial=cols[8];
const used=parseNumber(cols[11]);
const remain=parseNumber(cols[12]);

const statusWaktu=getStatusWaktu(expiredDate);

totalPJB+=amount;
totalUsed+=used;
totalRemain+=remain;

if(status=="DONE") done++;
else notyet++;

if(statusWaktu=="ACTIVE") active++;
else if(statusWaktu=="NEAR EXPIRED") near++;
else expired++;

const tr=document.createElement("tr");

tr.dataset.pjb=pjb.toLowerCase();
tr.dataset.serial=serial.toLowerCase();

tr.innerHTML=`
<td>${pjb}</td>
<td>${serial}</td>
<td>${expiredDate}</td>
<td>${formatRupiah(remain)}</td>
<td class="${status=="DONE"?"status-done":"status-notyet"}">${status}</td>
<td class="${getTimeClass(statusWaktu)}">${statusWaktu}</td>
`;

body.appendChild(tr);

});

document.getElementById("totalPJB").innerText=formatRupiah(totalPJB);
document.getElementById("totalUsed").innerText=formatRupiah(totalUsed);
document.getElementById("totalRemain").innerText=formatRupiah(totalRemain);

if(pieChartInstance) pieChartInstance.destroy();
pieChartInstance=new Chart(pieChart,{
type:"pie",
data:{
labels:["Terpakai","Sisa"],
datasets:[{data:[totalUsed,totalRemain]}]
}
});

if(barChartInstance) barChartInstance.destroy();
barChartInstance=new Chart(barChart,{
type:"bar",
data:{
labels:["DONE","NOT YET"],
datasets:[{data:[done,notyet],backgroundColor:["green","red"]}]
}
});

if(timeChartInstance) timeChartInstance.destroy();
timeChartInstance=new Chart(timeChart,{
type:"pie",
data:{
labels:["ACTIVE","NEAR EXPIRED","EXPIRED"],
datasets:[{data:[active,near,expired],backgroundColor:["green","#e6a700","red"]}]
}
});

}

loadDashboard();

setInterval(loadDashboard,60000);

</script>

</body>
</html>
