<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fasus Budget Dashboard</title>

<link rel="icon" type="image/x-icon" href="favicon.ico">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{font-family:Arial;margin:0;background:#f4f6f8;}
.header{background:#111;color:white;padding:15px 30px;display:flex;justify-content:space-between;align-items:center;}
.logo{height:40px;}
.container{padding:30px;}
.company{font-size:32px;font-weight:bold;}
.updated{color:#666;margin-bottom:20px;}
.cards{display:flex;gap:20px;margin-bottom:25px;}
.card{background:white;padding:20px;border-radius:8px;flex:1;box-shadow:0 2px 6px rgba(0,0,0,0.1);}
.card-title{color:#666;}
.card-value{font-size:28px;font-weight:bold;margin-top:5px;}
.charts{display:flex;gap:20px;margin-bottom:30px;flex-wrap:wrap;}
.chart-box{background:white;padding:20px;border-radius:8px;flex:1;height:350px;}
table{width:100%;background:white;border-collapse:collapse;}
th{background:#eee;padding:12px;text-align:left;}
td{padding:10px;border-top:1px solid #ddd;}
.status-done{color:green;font-weight:bold;}
.status-notyet{color:red;font-weight:bold;}
.time-active{color:green;font-weight:bold;}
.time-near{color:#e6a700;font-weight:bold;}
.time-expired{color:red;font-weight:bold;}
.search-box{background:white;padding:15px;margin-bottom:15px;border-radius:8px;box-shadow:0 2px 6px rgba(0,0,0,0.1);}
.search-input{width:100%;padding:12px;font-size:16px;border:1px solid #ccc;border-radius:6px;}
.highlight{background-color:#fff3cd;}
</style>
</head>

<body>

<div class="header">
<img src="logo-ut.png" class="logo">
<div>Fasus Budget Dashboard</div>
</div>

<div class="container">

<div class="company" id="companyName"></div>
<div id="companyBC" style="font-size:18px;font-weight:bold;margin-top:5px;"></div>
<div id="companyPlant" style="font-size:16px;font-weight:bold;margin-top:5px;"></div>
<div class="updated" id="updated"></div>

<div class="cards">
<div class="card">
<div class="card-title">Total Amount PJB</div>
<div class="card-value" id="totalPJB">Rp 0</div>
</div>
<div class="card">
<div class="card-title">Total Amount Terpakai</div>
<div class="card-value" id="totalUsed">Rp 0</div>
</div>
<div class="card">
<div class="card-title">Total Amount Sisa Budget PJB</div>
<div class="card-value" id="totalRemain">Rp 0</div>
</div>
</div>

<div class="cards">
<div class="card" id="searchTotalCard" style="display:none;border-left:5px solid #007bff;">
<div class="card-title" id="searchTotalTitle">Total nomor PJB</div>
<div class="card-value" id="searchTotalValue">Rp 0</div>
</div>
</div>

<div class="charts">
<div class="chart-box"><canvas id="pieChart"></canvas></div>
<div class="chart-box"><canvas id="barChart"></canvas></div>
</div>

<div class="charts">
<div class="chart-box" style="height:300px;max-width:400px;margin:auto;">
<canvas id="timeChart"></canvas>
</div>
</div>

<div class="search-box">
<input type="text" id="searchInput" class="search-input"
placeholder="Cari berdasarkan PJB atau Serial Number..."
onkeyup="searchTable()">
</div>

<table>
<thead>
<tr id="tableHeaderRow">
<th>PJB</th>
<th>Serial Number</th>
<th>BC</th>
<th>Expired Date</th>
<th>Sisa Budget</th>
<th>Status</th>
<th>Status Waktu</th>
<th>Business Area</th>
<th>Model</th>
</tr>
</thead>
<tbody id="tableBody"></tbody>
</table>

</div>

<script>

const BASE_CSV_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vSNBKCI899Hkc1JJNoKS1CbV41KRxJd7myAsxxfko-zsMW0lro-KUDrzD472KkQESaZzXavw_M1Pp8l/pub?gid=17086544&single=true&output=csv";

let pieChartInstance=null;
let barChartInstance=null;
let timeChartInstance=null;
let isLoading=false;

function getCSVUrl(){
return BASE_CSV_URL+"&t="+Date.now();
}

function formatRupiah(num){
return "Rp "+num.toLocaleString("id-ID");
}

function getCompany(){
const p=new URLSearchParams(window.location.search).get("company");
return p ? p.trim() : null;
}

function getRegion(){
const p=new URLSearchParams(window.location.search).get("region");
return p ? p.trim() : null;
}

function getMode(){
if(getCompany()) return "company";
if(getRegion()) return "region";
return null;
}

function parseNumber(str){
if(!str) return 0;
return parseFloat(str.replace(/Rp/g,"").replace(/\./g,"").replace(/,/g,"").trim())||0;
}

function getTimeClass(status){
if(status==="ACTIVE") return "time-active";
if(status==="NEAR EXPIRED") return "time-near";
if(status==="EXPIRED") return "time-expired";
return "";
}

function searchTable(){
const input=document.getElementById("searchInput").value.toLowerCase();
const rows=document.querySelectorAll("#tableBody tr");

rows.forEach(row=>{
const pjb=row.getAttribute("data-pjb");
const serial=row.getAttribute("data-serial");
row.classList.remove("highlight");
if(pjb.includes(input)||serial.includes(input)){
row.style.display="";
if(input!=="") row.classList.add("highlight");
}else{
row.style.display="none";
}
});
updateSearchTotal();
}

function updateSearchTotal(){
const input=document.getElementById("searchInput").value.toLowerCase();
const rows=document.querySelectorAll("#tableBody tr");
let total=0;
let found="";
rows.forEach(row=>{
if(row.style.display==="none") return;
if(!found) found=row.getAttribute("data-pjb");
const cells=row.querySelectorAll("td");
const remainText=cells[getMode()==="region"?5:4].innerText;
total+=parseNumber(remainText);
});
const card=document.getElementById("searchTotalCard");
if(input===""){card.style.display="none";return;}
document.getElementById("searchTotalTitle").innerText="Total nomor PJB "+found;
document.getElementById("searchTotalValue").innerText=formatRupiah(total);
card.style.display="block";
}

async function loadDashboard(){
if(isLoading) return;
isLoading=true;

try{
const response=await fetch(getCSVUrl(),{cache:"no-store"});
const text=await response.text();

const company=getCompany();
const region=getRegion();
const mode=getMode();

document.getElementById("updated").innerText="Last updated: "+new Date().toLocaleString("id-ID");

const rows=text.split("\n").slice(1);

let totalPJB=0,totalUsed=0,totalRemain=0;
let doneCount=0,notyetCount=0;
let activeCount=0,nearCount=0,expiredCount=0;

const body=document.getElementById("tableBody");
body.innerHTML="";

const header=document.getElementById("tableHeaderRow");

if(mode==="region"){
header.innerHTML=`
<th>Pemilik Fasus</th>
<th>PJB</th>
<th>Serial Number</th>
<th>BC</th>
<th>Expired Date</th>
<th>Sisa Budget</th>
<th>Status</th>
<th>Status Waktu</th>
<th>Model</th>
`;
}else{
header.innerHTML=`
<th>PJB</th>
<th>Serial Number</th>
<th>BC</th>
<th>Expired Date</th>
<th>Sisa Budget</th>
<th>Status</th>
<th>Business Area</th>
<th>Status Waktu</th>
<th>Model</th>
`;
}

rows.forEach(row=>{
const cols=row.split(",");
const comp=(cols[0]||"").trim();
const bc=(cols[1]||"").trim();
const expired=cols[2];
const amountPJB=parseNumber(cols[4]);
const status=cols[5];
const pjb=cols[6];
const serial=cols[7];
const used=parseNumber(cols[8]);
const remain=parseNumber(cols[9]);
const statusWaktu=(cols[10]||"").trim().toUpperCase();
const plant=(cols[11]||"").trim();
const model=(cols[12]||"").trim();

if(mode==="company" && comp!==company) return;
if(mode==="region" && plant.toUpperCase()!==region.toUpperCase()) return;

totalPJB+=amountPJB;
totalUsed+=used;
totalRemain+=remain;

if(status==="DONE") doneCount++; else notyetCount++;
if(statusWaktu==="ACTIVE") activeCount++;
else if(statusWaktu==="NEAR EXPIRED") nearCount++;
else if(statusWaktu==="EXPIRED") expiredCount++;

const tr=document.createElement("tr");
tr.setAttribute("data-pjb",pjb.toLowerCase());
tr.setAttribute("data-serial",serial.toLowerCase());

if(mode==="region"){
tr.innerHTML=`
<td>${comp}</td>
<td>${pjb}</td>
<td>${serial}</td>
<td>${bc}</td>
<td>${expired}</td>
<td>${formatRupiah(remain)}</td>
<td class="${status==="DONE"?"status-done":"status-notyet"}">${status}</td>
<td class="${getTimeClass(statusWaktu)}">${statusWaktu}</td>
<td>${model}</td>
`;
}else{
tr.innerHTML=`
<td>${pjb}</td>
<td>${serial}</td>
<td>${bc}</td>
<td>${expired}</td>
<td>${formatRupiah(remain)}</td>
<td class="${status==="DONE"?"status-done":"status-notyet"}">${status}</td>
<td>${plant}</td>
<td class="${getTimeClass(statusWaktu)}">${statusWaktu}</td>
<td>${model}</td>
`;
}

body.appendChild(tr);
});

if(mode==="region"){
document.getElementById("companyName").innerText=region;
document.getElementById("companyBC").innerText="Area Code: "+region;
document.getElementById("companyPlant").innerText="";
}else{
document.getElementById("companyName").innerText=company;
}

document.getElementById("totalPJB").innerText=formatRupiah(totalPJB);
document.getElementById("totalUsed").innerText=formatRupiah(totalUsed);
document.getElementById("totalRemain").innerText=formatRupiah(totalRemain);

if(pieChartInstance) pieChartInstance.destroy();
pieChartInstance=new Chart(pieChart,{type:"pie",data:{labels:["Terpakai","Tersisa"],datasets:[{data:[totalUsed,totalRemain]}]},options:{responsive:true,maintainAspectRatio:false}});

if(barChartInstance) barChartInstance.destroy();
barChartInstance=new Chart(barChart,{type:"bar",data:{labels:["DONE","NOT YET"],datasets:[{data:[doneCount,notyetCount],backgroundColor:["green","red"]}]},options:{responsive:true,maintainAspectRatio:false}});

if(timeChartInstance) timeChartInstance.destroy();
timeChartInstance=new Chart(timeChart,{type:"pie",data:{labels:["ACTIVE","NEAR EXPIRED","EXPIRED"],datasets:[{data:[activeCount,nearCount,expiredCount],backgroundColor:["green","#e6a700","red"]}]},options:{responsive:true,maintainAspectRatio:false}});

}catch(e){console.error(e);}
isLoading=false;
}

loadDashboard();
setInterval(loadDashboard,60000);
document.addEventListener("visibilitychange",function(){if(!document.hidden) loadDashboard();});
window.addEventListener("focus",loadDashboard);
window.addEventListener("pageshow",loadDashboard);


/* ===========================
   INTERNAL EDIT SYSTEM ADDITION
   =========================== */

const WEB_APP_URL="https://script.google.com/macros/s/AKfycbwge43MLowMLLJaGyM3PI5kc5HzOlqnukzOWPGEih2QwAjQfCtHzinXJdT5zohl3XIL/exec";
let loggedUser=null;

document.addEventListener("DOMContentLoaded",function(){
const header=document.querySelector(".header");
const btn=document.createElement("button");
btn.innerText="Edit";
btn.style.padding="8px 14px";
btn.style.background="#ffc107";
btn.style.border="none";
btn.style.borderRadius="4px";
btn.style.cursor="pointer";
btn.style.fontWeight="bold";
btn.onclick=openLogin;
header.appendChild(btn);
});

function openLogin(){
document.getElementById("loginModal").style.display="flex";
}

function login(){
const username=document.getElementById("username").value;
const password=document.getElementById("password").value;

fetch(WEB_APP_URL,{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
action:"login",
username:username,
password:password
})
})
.then(res=>res.json())
.then(res=>{
if(res.status==="success"){
loggedUser=username;
document.getElementById("loginModal").style.display="none";
document.getElementById("editModal").style.display="flex";
}else{
alert("Login gagal");
}
});
}

function submitUpdate(){
const pjb=document.getElementById("editPJB").value;
const serial=document.getElementById("editSerial").value;
const nominal=document.getElementById("editNominal").value;
const nama=document.getElementById("editNama").value;

fetch(WEB_APP_URL,{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
action:"update",
username:loggedUser,
pjb:pjb,
serial:serial,
nominal:nominal,
namaTransaksi:nama
})
})
.then(res=>res.json())
.then(res=>{

if(res.status==="success"){
alert("Berhasil update");
document.getElementById("editModal").style.display="none";
loadDashboard();
}

if(res.status==="exceed"){
alert("Nominal melebihi sisa budget");
}

if(res.status==="invalid"){
alert("Nominal tidak valid");
}

if(res.status==="notfound"){
alert("Data tidak ditemukan");
}

});
}

</script>

<!-- LOGIN MODAL -->
<div id="loginModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);justify-content:center;align-items:center;z-index:9999;">
<div style="background:white;padding:25px;border-radius:8px;width:300px;">
<h3>Login Internal</h3>
<input id="username" placeholder="Username" style="width:100%;padding:8px;margin-bottom:10px;">
<input id="password" type="password" placeholder="Password" style="width:100%;padding:8px;margin-bottom:10px;">
<button onclick="login()" style="width:100%;padding:8px;background:#ffc107;border:none;font-weight:bold;">Login</button>
</div>
</div>

<!-- EDIT MODAL -->
<div id="editModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);justify-content:center;align-items:center;z-index:9999;">
<div style="background:white;padding:25px;border-radius:8px;width:350px;">
<h3>Input Transaksi</h3>
<input id="editPJB" placeholder="PJB" style="width:100%;padding:8px;margin-bottom:10px;">
<input id="editSerial" placeholder="Serial Number" style="width:100%;padding:8px;margin-bottom:10px;">
<input id="editNominal" type="number" placeholder="Nominal" style="width:100%;padding:8px;margin-bottom:10px;">
<input id="editNama" placeholder="Nama Transaksi" style="width:100%;padding:8px;margin-bottom:10px;">
<button onclick="submitUpdate()" style="width:100%;padding:8px;background:#28a745;color:white;border:none;font-weight:bold;">Simpan</button>
</div>
</div>

</body>
</html>
