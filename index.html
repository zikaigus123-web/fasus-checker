<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fasus Budget Checker</title>

<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="shortcut icon" href="favicon.ico">
<link rel="apple-touch-icon" href="favicon.ico">

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:url("background.jpg") no-repeat center center fixed;
background-size:cover;
}

.overlay{
position:relative;
width:100%;
height:100vh;
background:rgba(0,0,0,0.55);
}

.logo-ut{
position:absolute;
top:20px;
right:80px;
height:40px;
z-index:10;
}

.logo-insani{
position:absolute;
bottom:20px;
left:50%;
transform:translateX(-50%);
height:45px;
z-index:10;
}

.center-container{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
text-align:center;
color:white;
}

.title{
font-size:48px;
font-weight:bold;
margin-bottom:25px;
}

.search-wrapper{
display:flex;
flex-direction:column;
align-items:center;
gap:10px;
}

.filter-select{
width:320px;
padding:10px;
font-size:14px;
border-radius:4px;
border:none;
outline:none;
}

.search-box{
position:relative;
}

#searchInput{
width:320px;
padding:12px;
font-size:16px;
border-radius:4px;
border:none;
outline:none;
}

button{
padding:12px 22px;
font-size:16px;
font-weight:bold;
background:#ffc107;
border:none;
border-radius:4px;
cursor:pointer;
}

button:hover{
background:#e0a800;
}

.suggestions{
position:absolute;
top:46px;
left:0;
width:100%;
background:white;
color:black;
border-radius:4px;
max-height:200px;
overflow-y:auto;
z-index:9999;
box-shadow:0 4px 10px rgba(0,0,0,0.3);
}

.suggestion-item{
padding:10px;
cursor:pointer;
}

.suggestion-item:hover{
background:#eee;
}

</style>
</head>

<body>

<div class="overlay">

<img src="logo-ut.png" class="logo-ut">

<div class="center-container">

<div class="title">CEK BUDGET FASUS</div>

<div class="search-wrapper">

<select id="searchMode" class="filter-select">
<option value="company">Search by Company</option>
<option value="region">Search by Business Area</option>
</select>

<div class="search-box">

<input
type="text"
id="searchInput"
placeholder="Masukkan nama perusahaan atau business area"
autocomplete="off"
>

<div id="suggestions" class="suggestions"></div>

</div>

<button onclick="checkSearch()">Check</button>

</div>

</div>

<img src="logo-insan.png" class="logo-insani">

</div>

<script>

const CSV_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vQhL1bg675LEpC5RKt_JXxCuwLfR36OtrtGr5AeaKBYN4_0fTWax_NcYoHAgUTifDNuv96GPmmf9sS8/pub?gid=17086544&single=true&output=csv";

let companies=[];
let regions=[];

const input=document.getElementById("searchInput");
const suggestionBox=document.getElementById("suggestions");
const searchMode=document.getElementById("searchMode");

function parseCSV(text){
const lines=text.split("\n");
const result=[];
for(let line of lines){
if(line.trim()==="") continue;
const cols=line.split(",");
result.push(cols);
}
return result;
}

fetch(CSV_URL)
.then(res=>res.text())
.then(text=>{
const parsed=parseCSV(text).slice(1);

parsed.forEach(cols=>{
if(cols[0]) companies.push(cols[0].trim());
if(cols[11]) regions.push(cols[11].trim());
});

companies=[...new Set(companies)].sort();
regions=[...new Set(regions)].sort();
});

input.addEventListener("input",function(){

const value=this.value.toLowerCase();
suggestionBox.innerHTML="";
if(!value) return;

const source=searchMode.value==="company"?companies:regions;

source
.filter(item=>item.toLowerCase().includes(value))
.forEach(item=>{
const div=document.createElement("div");
div.className="suggestion-item";
div.textContent=item;
div.onclick=function(){
input.value=item;
suggestionBox.innerHTML="";
};
suggestionBox.appendChild(div);
});

});

function checkSearch(){

const value=input.value.trim();

if(!value){
alert("Masukkan data pencarian");
return;
}

if(searchMode.value==="company"){
window.location.href=
"fasus-dashboard.html?company="+encodeURIComponent(value);
}else{
window.location.href=
"fasus-dashboard.html?region="+encodeURIComponent(value);
}

}

document.addEventListener("click",function(e){
if(!e.target.closest(".search-box")){
suggestionBox.innerHTML="";
}
});

</script>

</body>
</html>
