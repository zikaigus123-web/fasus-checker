<script>

const CSV_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vQUKPRwONIwVc0snCr28PWvOKCyRJUf_J4mMEP2qGXFzrhFW_u9NbjlnHnWLXQdnNmZbtkVfAxOQnw9/pub?gid=1324873592&single=true&output=csv";

let companies=[];

const input=document.getElementById("searchInput");
const suggestionBox=document.getElementById("suggestions");

/* parser CSV aman dan stabil */
function parseCSV(text){

const lines=text.split("\n");

const result=[];

for(let i=1;i<lines.length;i++){

const line=lines[i];

if(!line || line.trim()==="") continue;

const cols=line.split(",");

const company=cols[0];

if(company && company.trim()!==""){
result.push(company.trim());
}

}

return result;

}

/* load data */
fetch(CSV_URL)
.then(res=>res.text())
.then(text=>{

const parsed=parseCSV(text);

const unique=[...new Set(parsed)];

companies=unique.sort();

});

/* suggestion */
input.addEventListener("input",function(){

const value=this.value.toLowerCase();

suggestionBox.innerHTML="";

if(!value) return;

const filtered=companies.filter(company =>
company.toLowerCase().includes(value)
);

filtered.forEach(company=>{

const div=document.createElement("div");

div.className="suggestion-item";
div.textContent=company;

div.onclick=function(){

input.value=company;
suggestionBox.innerHTML="";

};

suggestionBox.appendChild(div);

});

});

/* redirect */
function checkCompany(){

const company=input.value.trim();

if(!company){
alert("Masukkan nama perusahaan");
return;
}

window.location.href=
"fasus-dashboard.html?company="+encodeURIComponent(company);

}

/* klik luar */
document.addEventListener("click",function(e){

if(!e.target.closest(".search-box")){
suggestionBox.innerHTML="";
}

});

</script>
